# Manual fallback only. The weekly run is on the Mac mini (reviews-weekly.sh,
# launchd com.chifstays.reviews, Monday 07:40), because Vrbo turns away
# GitHub's machines and headless browsers. This one does Airbnb and Booking.com
# only: start it by hand from the Actions tab if the mini is down.
name: reviews
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Airbnb
        id: airbnb
        continue-on-error: true
        run: node fetch-reviews.mjs
      - name: Booking.com
        id: booking
        continue-on-error: true
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          python fetch-booking-reviews.py
      - run: node build.mjs
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Enzo"
            git config user.email "enzo@users.noreply.github.com"
            git add -A
            git commit -m "New guest reviews"
            git push
          else
            echo "No new reviews."
          fi
      - name: Fail the run if a site could not be read
        if: steps.airbnb.outcome == 'failure' || steps.booking.outcome == 'failure'
        run: |
          echo "Airbnb: ${{ steps.airbnb.outcome }}, Booking.com: ${{ steps.booking.outcome }}"
          exit 1
